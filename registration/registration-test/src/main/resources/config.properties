## Environment setup (runSetup.bat) - run once before automation.
## Creates operatorId/supervisorUserid/reviewerUserid above in Keycloak with their passwords,
## maps them to the zone/center below and creates + activates this machine.
## A Rancher ConfigMap or Secret with the same key overrides that line. Unset keys stay as written here.
mosip.hostname=api-internal.dev2.mosip.net
## Admin API base url, defaults to https://<mosip.hostname>; use api-internal host if admin APIs are not public
setup.admin.baseUrl=https://api-internal.dev2.mosip.net
## Center and zone must be inside the admin user's zone (globaladmin -> TZT)
setup.regCenterId=10011
setup.zoneCode=TZT
## Admin user with GLOBAL_ADMIN/ZONAL_ADMIN role for masterdata calls
setup.admin.userName=globaladmin
setup.admin.password=mosip123
setup.admin.appId=admin
setup.admin.clientId=mosip-admin-client
setup.admin.clientSecret=sPaAsEKiY6t5MhGS
## Keycloak url including /auth when the server uses it; client needs manage-users and view-realm roles
setup.keycloak.url=https://iam.dev2.mosip.net/auth
setup.keycloak.realm=mosip
setup.keycloak.clientId=mosip-testrig-client
setup.keycloak.clientSecret=Yn5nMPz4sI21Jf4a
setup.user.roles=REGISTRATION_ADMIN,REGISTRATION_SUPERVISOR,REGISTRATION_OPERATOR,ZONAL_ADMIN,Default
## Optional: defaults to first machine spec on server / machine name
#setup.machine.specId=
#setup.machine.serialNum=
## Mock MDS device certificate: device provider partner + DEVICE domain chain in PMS (DSL flow).
## When userName is unset, setup creates Keycloak user regclientpms with PARTNER_ADMIN and PARTNERMANAGER.
## Set both to use an existing partner admin instead of creating one.
setup.pms.clientId=mosip-pms-client
setup.pms.clientSecret=l58v7fvmCXbEHqUt
#setup.pms.userName=
#setup.pms.password=
## Defaults: partner regclient_device_<machine name>, keys in ./mds-certs, p12 password qwerty@123
#setup.mds.partnerId=
#setup.mds.certsDir=mds-certs
#setup.mds.p12Password=qwerty@123
## Optional override of the Mock MDS run folder. Leave unset to use target/mockmds, staged from the
## io.mosip.mock.mds:mock-mds dependency during mvn package. The automation starts and stops that process.
#setup.mockmds.dir=
## Y/N toggles for each step
setup.createUsers=Y
setup.mapUsers=Y
setup.createMachine=Y
setup.mockMds=Y
## Minutes runAll.bat waits after a new user or machine is created, before initial launch.
## Skipped when the user and machine already exist. 0 skips the wait always.
setup.propagationWaitMinutes=15

## BioCorrection with additionalInfoRequestId "AUTO": a NEW packet (seedFile in datadir, or /folder/file.json
## from the run folder) is captured with
## seedScore (< 30 makes regproc pause it for BIOMETRIC_CORRECTION) and the request id is read from regprc DB.
bioCorrection.seedFile=NewAdult.json
bioCorrection.seedScore=20
## dev2 created the request about 22 minutes after the packet was uploaded.
bioCorrection.requestWaitSeconds=1800
